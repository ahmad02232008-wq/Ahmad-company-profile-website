[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_18"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install --no-audit --no-fund",
    "npm run production"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && (php artisan storage:link || true) && exec php artisan serve --host=0.0.0.0 --port=$PORT"